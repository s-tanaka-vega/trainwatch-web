<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TrainWatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ナビバー */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 16px 2px;
      border-bottom: 1px solid #2a2a2a;
    }
    .navbar-title {
      font-size: 1rem;
      font-weight: 600;
    }
    #navbar-date {
      font-size: 1.05rem;
      font-weight: 600;
      color: #CE93D8;
      margin-left: 10px;
    }
    #battery {
      font-size: 1.15rem;
      font-weight: 700;
      color: #26C6DA;
      margin-left: 8px;
    }
    #refresh-btn {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
    #refresh-btn:disabled { opacity: 0.4; cursor: default; }

    /* 時刻 */
    #clock {
      font-family: 'Nunito', 'Arial Rounded MT Bold', 'Hiragino Maru Gothic ProN', sans-serif;
      font-size: clamp(2.8rem, 16vw, 4.5rem);
      font-weight: 900;
      padding: 4px 16px 0;
      letter-spacing: 0.04em;
      color: #D8DCE0;
    }

    /* 紫ライン */
    .divider-purple {
      height: 3px;
      background: #AB47BC;
      border-radius: 2px;
      margin: 4px 24px 4px;
    }

    /* ステータス + 天気バー */
    #status-bar {
      padding: 2px 16px 4px;
    }
    #fetch-status {
      font-size: 0.72rem;
      color: #26C6DA;
      white-space: nowrap;
      min-width: 28px;
      flex-shrink: 0;
    }
    #weather-panel { width: 100%; }
    #rank-summary-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1px 16px 2px;
    }
    #rank-summary-row {
      flex: 1;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    #umbrella-row {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 2px;
      display: none;
    }
    .weather-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 1px;
      flex-wrap: wrap;
    }
    .weather-location {
      display: inline-block;
      width: 56px;
      flex-shrink: 0;
    }
    .weather-row-sm {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .tomorrow-label {
      display: inline-block;
      width: 28px;
      font-size: 0.72rem;
      color: #666;
      flex-shrink: 0;
      padding-top: 2px;
    }
    .weather-divider-thin {
      border-top: 1px dashed #2a2a2a;
      margin: 2px 0;
    }
    #weather-links {
      padding: 2px 16px 4px;
      font-size: 0.72rem;
    }
    #weather-links a {
      color: #26C6DA;
      text-decoration: none;
    }
    #weather-links a:hover { text-decoration: underline; }
    .weather-link-sep {
      color: #555;
      margin: 0 6px;
    }

    /* カード一覧 */
    #cards {
      padding: 0 16px 24px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .line-name {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .rank-badge {
      font-size: 1.05rem;
      font-weight: bold;
    }
    .card-desc {
      font-size: 0.9rem;
      color: #9e9e9e;
      margin-bottom: 4px;
    }
    .scores {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 4px;
    }
    .divider-thin {
      border-top: 1px solid #2d2d2d;
      margin: 6px 0;
    }
    .headlines {
      font-size: 0.9rem;
      color: #9e9e9e;
      white-space: pre-wrap;
      line-height: 1.6;
      word-break: break-all;
    }
    .headlines-wide {
      font-size: 1rem;
      line-height: 1.8;
    }

    /* スピナー */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #444;
      border-top-color: #e0e0e0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* スケルトン（読み込み中プレースホルダー） */
    .skeleton {
      background: #2a2a2a;
      border-radius: 4px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    /* 追跡パネル */
    #tracker-wrap {
      padding: 0 16px 8px;
      display: none;
    }
    #tracker-toggle {
      background: none;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      color: #666;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 7px 15px;
      cursor: pointer;
      font-family: inherit;
    }
    #tracker-toggle.on {
      border-color: #26C6DA;
      color: #26C6DA;
    }
    #tracker-head {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    #tracker-body { display: none; margin-top: 8px; }
    #tracker-body.on { display: block; }
    #tracker-dir {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .tracker-dir-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      padding: 2px 0;
      font-size: inherit;
      font-weight: inherit;
      font-family: inherit;
    }
    .tracker-dir-btn.sel { color: #CE93D8; }
    #tracker-stations {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 6px;
    }
    .tracker-st-btn {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      color: #9e9e9e;
      font-size: 0.92rem;
      padding: 7px 13px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .tracker-st-btn.sel {
      border-color: #26C6DA;
      color: #26C6DA;
      font-weight: 700;
    }
    #tracker-list {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 10px 8px 10px 12px;   /* 残り時間の桁が窮屈なので右だけ詰める */
      max-height: 320px;
      overflow-y: auto;
      font-size: 0.88rem;
    }
    .tracker-row {
      display: flex;
      align-items: center;
      line-height: 2.05em;
      padding: 3px 2px;      /* 行同士がくっつかない程度の余白 */
      white-space: nowrap;
    }
    .tracker-row.past { opacity: 0.4; }
    .tracker-row.next { font-weight: 700; }
    /* 目的地に早く着く2本に細い下線。行の高さが変わらないよう padding で 1px 相殺 */
    .tracker-row.tr-soonest {
      border-bottom: 1px solid rgba(38, 198, 218, 0.55);
      padding-bottom: 2px;
    }
    /* 発車時刻と残り時間は同サイズ。360px 幅で着時刻が省略されない上限が 1.6em */
    /* ▶ は小さめ。width は自身の font-size 基準なので列幅は従来どおり約 0.85em */
    .tr-mark { width: 1.25em; flex-shrink: 0; font-size: 0.68em; color: #26C6DA; }
    .tr-dep  {
      width: 3.0em;          /* 自身の font-size 基準。太字の "12:34" が溢れない幅 */
      flex-shrink: 0;
      margin-right: 0.34em;  /* 太字時に種別とくっつかないよう空ける */
      font-size: 1.6em;
      line-height: 1;        /* 行高を base の line-height に合わせる */
      font-variant-numeric: tabular-nums;
    }
    /* 種別（常に2文字）の直後に ! が付くよう幅を詰める → 「各停!」 */
    .tr-type { width: 2.1em; flex-shrink: 0; }
    .tr-bang { width: 0.75em; flex-shrink: 0; color: #EA4335; font-weight: 700; }
    .tr-dest { width: 4.0em; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
    .tr-arr  { flex: 1; min-width: 0; color: #9e9e9e; overflow: hidden; text-overflow: ellipsis; }
    .tr-left {
      width: 3.2em;          /* 太字の "19:19"（5桁）が右に溢れない幅 */
      flex-shrink: 0;
      text-align: right;
      font-size: 1.6em;      /* .tr-dep と同サイズ */
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }
    /* "1:12:34" のような長い表示は幅を変えずに字を縮めて収める */
    .tr-left.tr-left-long { font-size: 1.12em; }
    #tracker-empty { color: #666; font-size: 0.86rem; padding: 6px 0; }
    .tr-unreachable { color: #666; }
    .tr-ty-rapid { color: #FF6D01; }
    .tr-ty-local { color: #4FC3F7; }
    .tr-ty-exp   { color: #EA4335; }
    .tr-ty-ltd   { color: #CE93D8; }
    .tr-ty-semi  { color: #66BB6A; }
  </style>
</head>
<body>

<div class="navbar">
  <span class="navbar-title">TrainWatcher</span><span id="navbar-date"></span><span id="battery">--</span>
  <button id="refresh-btn" onclick="manualRefresh()">↺</button>
</div>

<div id="clock">--:--:--</div>
<div class="divider-purple"></div>

<div id="countdown-panel" style="display:none;padding:2px 16px 2px;font-family:'Nunito','Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif">
  <div id="countdown-main" style="font-size:clamp(1.55rem, 5.6vw, 2.15rem);font-weight:900;color:#FBBC04;line-height:1.15;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  <div id="countdown-sub"  style="font-size:clamp(1.3rem, 4.6vw, 1.75rem);font-weight:700;color:#888;margin-top:2px;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
</div>

<div id="status-bar">
  <div id="weather-panel">
    <div id="umbrella-row"></div>
    <div id="hadano-row" class="weather-row"></div>
    <div id="minamimachida-row" class="weather-row"></div>
    <div id="tomorrow-section" style="display:none">
      <div class="weather-divider-thin"></div>
      <div id="hadano-tomorrow-row" class="weather-row weather-row-sm"></div>
      <div id="minamimachida-tomorrow-row" class="weather-row weather-row-sm"></div>
    </div>
  </div>
</div>

<div id="rank-summary-bar">
  <span id="fetch-status">未取得</span>
  <span id="rank-summary-row"></span>
</div>

<div id="weather-links">
  <a href="https://tenki.jp/forecast/3/17/4620/14211/1hour.html" target="_blank">秦野天気</a>
  <span class="weather-link-sep">/</span>
  <a href="https://transit.yahoo.co.jp/traininfo/area/4/" target="_blank">関東広域電車情報</a>
  <span class="weather-link-sep">/</span>
  <a href="javascript:void(0)" id="cd-toggle-btn" onclick="cycleDisplayMode()">モードセレクト(天気)</a>
  <span id="custom-cd-wrap" style="display:none">
    <span class="weather-link-sep">/</span>
    <a href="javascript:void(0)" id="countdown-btn" onclick="toggleCustomCountdown()">任意時刻</a>
  </span>
</div>

<div id="tracker-wrap">
  <div id="tracker-head">
    <button id="tracker-toggle" onclick="toggleTracker()">追跡 OFF</button>
    <div id="tracker-dir"></div>
  </div>
  <div id="tracker-body">
    <div id="tracker-stations"></div>
    <div id="tracker-list"></div>
  </div>
</div>

<div id="cards">
  <!-- スケルトンカード（初期表示） -->
  <div class="card" style="opacity:0.5">
    <div class="skeleton" style="height:18px;width:60%;margin-bottom:8px"></div>
    <div class="skeleton" style="height:14px;width:40%"></div>
  </div>
  <div class="card" style="opacity:0.5">
    <div class="skeleton" style="height:18px;width:55%;margin-bottom:8px"></div>
    <div class="skeleton" style="height:14px;width:35%"></div>
  </div>
</div>

<script>
// ============================================================
// 設定
// ============================================================
const PROXY_BASE = 'https://trainwatch-proxy.s-tanaka-vega.workers.dev/?url=';

const TRANSIT_URL    = 'https://transit.yahoo.co.jp/diainfo/area/4';
const DETAIL_BASE    = 'https://transit.yahoo.co.jp/diainfo';

const TARGET_LINES = [
  '広域', '東急田園都市線', '小田急江ノ島線',
  '小田急小田原線', 'ＪＲ横浜線', '相鉄本線', 'みなとみらい線'
];

// 取得はするがカード・ランクサマリーには出さない。追跡パネルの「!」だけに使う
const TRACKER_ONLY_LINES = ['みなとみらい線'];

// Yahoo 運行情報 詳細ページ ID（埋め込みツイートを含む）
const LINE_DETAIL_ID = {
  '東急田園都市線': 114,
  '小田急江ノ島線': 110,
  '小田急小田原線': 109,
  'ＪＲ横浜線':    31,
  '相鉄本線':      125,
  'みなとみらい線': 401,
};

const TARGET_LINE_KEYMAP = {
  '東急田園都市線': ['東急田園都市'],
  '小田急小田原線': ['小田急小田原'],
  '小田急江ノ島線': ['小田急江ノ島', '江ノ島線'],
  'ＪＲ横浜線':    ['横浜線', 'ＪＲ横浜'],
  '相鉄本線':      ['相鉄本線', '相鉄本'],
  'みなとみらい線': ['みなとみらい'],
};

const LOCATIONS = [
  { name: 'hadano',        label: '秦野',  lat: 35.3833, lon: 139.2167, color: '#FF8C00', elemId: 'hadano-row' },
  { name: 'minamiMachida', label: '南町田', lat: 35.5419, lon: 139.4651, color: '#CE93D8', elemId: 'minamimachida-row' },
];

// ============================================================
// ユーティリティ
// ============================================================
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function nodeText(el) {
  return (el ? (el.textContent || el.innerText || '') : '')
    .replace(/\s+/g,' ').trim();
}

// タイムアウト付き fetch。指定 ms で中断して throw する
const FETCH_TIMEOUT_MS = 8000;

async function fetchWithTimeout(url, opts = {}, timeoutMs = FETCH_TIMEOUT_MS) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), timeoutMs);
  try {
    return await fetch(url, { ...opts, signal: ac.signal });
  } finally {
    clearTimeout(timer);
  }
}

// Worker が詰まる/一時的に落ちるケースがあるので1回だけリトライする
async function fetchViaProxy(url) {
  const target = PROXY_BASE + encodeURIComponent(url);
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetchWithTimeout(target, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch(e) {
      if (attempt === 1) throw e;
      console.warn('proxy retry', url, e);
    }
  }
}

// ============================================================
// 天気
// ============================================================
function wmoIcon(c) {
  if (c===0) return '☀️'; if (c===1) return '🌤';
  if (c===2) return '⛅️'; if (c===3) return '☁️';
  if (c===45||c===48) return '🌫';
  if (c>=51&&c<=55)   return '🌦';
  if (c>=61&&c<=65)   return '🌧';
  if (c>=71&&c<=77)   return '🌨';
  if (c>=80&&c<=82)   return '🌧';
  if (c>=95&&c<=99)   return '⛈';
  return '🌡';
}
function wmoDesc(c) {
  if (c===0) return '快晴'; if (c===1) return '晴れ';
  if (c===2) return '晴れ/くもり'; if (c===3) return 'くもり';
  if (c===45||c===48) return '霧';
  if (c>=51&&c<=55)   return '霧雨';
  if (c>=61&&c<=65)   return '雨';
  if (c>=71&&c<=77)   return '雪';
  if (c>=80&&c<=82)   return 'にわか雨';
  if (c>=95&&c<=99)   return '雷雨';
  return '';
}
function isRainy(c) {
  return (c>=51&&c<=65)||(c>=80&&c<=82)||(c>=95&&c<=99);
}
function tempColor(t, c) {
  if (t>=38)       return '#880E4F';
  if (t>=33)       return '#C62828';
  if (t>=28)       return '#FF5722';
  if (t>=22)       return '#FF8A65';
  if (t>=16)       return '#FFD54F';
  if (t>=10)       return '#A5D6A7';
  if (t>=4)        return '#90CAF9';
  return '#42A5F5';
}
function precipColor(p) {
  if (p>=70) return '#4FC3F7';
  if (p>=40) return '#90CAF9';
  return '#e0e0e0';
}
function wmoDescColor(c) {
  if (c===0||c===1||c===2) return '#FFD54F';  // 快晴・晴れ・晴れ/くもり
  if (c===3)               return '#B0BEC5';  // くもり
  if (c===45||c===48)      return '#9E9E9E';  // 霧
  if (c>=51&&c<=55)        return '#81D4FA';  // 霧雨
  if (c>=61&&c<=65)        return '#4FC3F7';  // 雨
  if (c>=71&&c<=77)        return '#E1F5FE';  // 雪
  if (c>=80&&c<=82)        return '#29B6F6';  // にわか雨
  if (c>=95&&c<=99)        return '#FF7043';  // 雷雨
  return '#e0e0e0';
}

const weatherCache = {};

async function fetchWeather() {
  for (const loc of LOCATIONS) {
    try {
      const url =
        `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${loc.lat}&longitude=${loc.lon}` +
        `&current=temperature_2m,weather_code,precipitation_probability` +
        `&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max` +
        `&timezone=Asia%2FTokyo`;
      const res   = await fetchWithTimeout(url);
      const json  = await res.json();
      const cur   = json.current;
      const daily = json.daily;
      weatherCache[loc.name] = {
        icon:        wmoIcon(cur.weather_code),
        temp:        Math.round(cur.temperature_2m),
        tempValue:   cur.temperature_2m,
        precipProb:  cur.precipitation_probability ?? 0,
        weatherDesc: wmoDesc(cur.weather_code),
        code:        cur.weather_code,
        label:       loc.label,
        labelColor:  loc.color,
        elemId:      loc.elemId,
        tomorrowElemId: loc.elemId.replace('-row', '-tomorrow-row'),
        // 傘判定用: 今日24h最大（明日と同基準）
        umbrellaToday: {
          code:       daily.weather_code[0],
          precipProb: daily.precipitation_probability_max[0] ?? 0,
        },
        tomorrow: {
          icon:        wmoIcon(daily.weather_code[1]),
          tempMax:     Math.round(daily.temperature_2m_max[1]),
          tempMin:     Math.round(daily.temperature_2m_min[1]),
          precipProb:  daily.precipitation_probability_max[1] ?? 0,
          weatherDesc: wmoDesc(daily.weather_code[1]),
          code:        daily.weather_code[1],
        },
      };
    } catch(e) { console.warn('weather', loc.name, e); }
  }
  renderWeather();
}

function umbrellaLevel(info) {
  if (!info) return 0;
  const heavy = [61,62,63,64,65,80,81,82,95,96,99].includes(info.code);
  const p = info.precipProb;
  if (heavy || p >= 70) return 4;
  if (p >= 50) return 3;
  if (p >= 30) return 2;
  if (p >= 20) return 1;
  return 0;
}

function levelToAlert(level) {
  if (level === 4) return { text:'☂️☂️ 傘必須！！', color:'#FF1744', bold:true };
  if (level === 3) return { text:'☂️ 傘推奨！',   color:'#FF6D01', bold:true };
  if (level === 2) return { text:'🌂 傘かも',     color:'#FBBC04', bold:true };
  if (level === 1) return { text:'☁️ 予備',       color:'#90CAF9', bold:false };
  return null;
}

function renderWeather() {
  const h = weatherCache.hadano;
  const m = weatherCache.minamiMachida;

  // 傘アラート：今日・明日を個別判定して / で表示、高い方優先
  // 今日は24時間最大の確率/コードで判定（明日と同基準）
  const todayLevel    = Math.max(
    umbrellaLevel(h?.umbrellaToday),
    umbrellaLevel(m?.umbrellaToday)
  );
  const tomorrowLevel = Math.max(
    h?.tomorrow ? umbrellaLevel(h.tomorrow) : 0,
    m?.tomorrow ? umbrellaLevel(m.tomorrow) : 0
  );
  const todayAlert    = levelToAlert(todayLevel);
  const tomorrowAlert = levelToAlert(tomorrowLevel);

  const umbRow = document.getElementById('umbrella-row');
  // 常に今日 / 明日の枠を表示。傘なし日は薄い文字でプレースホルダー
  const alertSpan = (a, level) => level > 0 && a
    ? `<span style="color:${a.color};font-weight:${a.bold?700:400}">${a.text}</span>`
    : `<span style="color:#555;opacity:0.35">ー</span>`;
  const sep = '<span style="color:#888;margin:0 8px">/</span>';
  umbRow.innerHTML = alertSpan(todayAlert, todayLevel) + sep + alertSpan(tomorrowAlert, tomorrowLevel);
  umbRow.style.display = 'block';

  // 今日 各地点
  for (const info of [h, m]) {
    if (!info) continue;
    document.getElementById(info.elemId).innerHTML =
      `<span class="weather-location" style="color:${info.labelColor}">${info.label}</span>` +
      `<span style="white-space:nowrap">` +
        `<span style="display:inline-block;width:1.6em;text-align:center">${info.icon}</span>` +
        `<span style="color:${wmoDescColor(info.code)}">${escHtml(info.weatherDesc)}</span>&ensp;` +
        `<span style="color:${tempColor(info.tempValue, info.code)}">${info.temp}°C</span>&ensp;` +
        `<span style="color:${precipColor(info.precipProb)}">${info.precipProb}%</span>` +
      `</span>`;
  }

  // 明日 各地点
  const hasTomorrow = (h && h.tomorrow) || (m && m.tomorrow);
  document.getElementById('tomorrow-section').style.display = hasTomorrow ? '' : 'none';
  for (const info of [h, m]) {
    if (!info || !info.tomorrow) continue;
    const t = info.tomorrow;
    document.getElementById(info.tomorrowElemId).innerHTML =
      `<span class="weather-location" style="color:${info.labelColor};opacity:0.45">${info.label}</span>` +
      `<span style="white-space:nowrap">` +
        `<span style="display:inline-block;width:1.6em;text-align:center">${t.icon}</span>` +
        `<span style="color:${wmoDescColor(t.code)}">${escHtml(t.weatherDesc)}</span>&ensp;` +
        `<span style="color:${tempColor(t.tempMax, t.code)}">${t.tempMax}°C</span><span style="color:#666">/</span><span style="color:${tempColor(t.tempMin, t.code)}">${t.tempMin}°C</span>&ensp;` +
        `<span style="color:${precipColor(t.precipProb)}">${t.precipProb}%</span>` +
      `</span>`;
  }
}

async function fetchOfficialStatus() {
  try {
    const html   = await fetchViaProxy(TRANSIT_URL);
    const parser = new DOMParser();
    const doc    = parser.parseFromString(html, 'text/html');
    const result = {};

    // 旧形式: dl/dt/dd with colTrouble class
    doc.querySelectorAll('dl').forEach(dl => {
      if (!dl.innerHTML.includes('colTrouble')) return;
      const dt = dl.querySelector('dt');
      const dd = dl.querySelector('[class*="colTrouble"]');
      if (!dt || !dd) return;
      const dtText = nodeText(dt);
      const ddText = nodeText(dd);
      if (!dtText || !ddText || dtText.includes('現在運行情報')) return;
      result[dtText] = ddText;
    });

    // 新形式: table rows (路線 | 状況 | 詳細) — 平常運転は除外
    doc.querySelectorAll('table tr').forEach(tr => {
      const cells = tr.querySelectorAll('td');
      if (cells.length < 2) return;
      const lineName = nodeText(cells[0]);
      const status   = nodeText(cells[1]);
      if (!lineName || !status) return;
      if (lineName === '路線' || lineName.includes('現在運行')) return;
      if (status === '平常運転') return;
      if (!result[lineName]) result[lineName] = status;
    });

    return result;
  } catch(e) {
    console.warn('official status', e);
    return {};
  }
}

// 詳細ページからツイート本文＋経過時間＋遅延分数を抽出する
async function fetchLineDetail(lineName) {
  const id = LINE_DETAIL_ID[lineName];
  const empty = { delayScore: 0, crowdScore: 0, headlines: [], delayMin: 0, hasStrong: false };
  if (!id) return empty;
  const url = `${DETAIL_BASE}/${id}/0`;

  try {
    const html   = await fetchViaProxy(url);
    const parser = new DOMParser();
    const doc    = parser.parseFromString(html, 'text/html');

    // <li> 配下の p.tweet（本文）と a.time（N分前 / N時間前）を紐づけ抽出
    const items = [];
    const seen  = new Set();
    doc.querySelectorAll('li').forEach(li => {
      const tEl = li.querySelector('.tweet');
      if (!tEl) return;
      const text = (tEl.textContent || '').replace(/\s+/g,' ').trim();
      if (text.length < 10 || seen.has(text)) return;

      const timeEl = li.querySelector('.time');
      let ageMin = null;
      if (timeEl) {
        const s = timeEl.textContent || '';
        const m = s.match(/(\d+)\s*分前/);
        const h = s.match(/(\d+)\s*時間前/);
        if (m)      ageMin = parseInt(m[1], 10);
        else if (h) ageMin = parseInt(h[1], 10) * 60;
      }
      if (ageMin === null || ageMin > 180) return; // 3h超・タイムスタンプ無し除外

      seen.add(text);
      items.push({ text, ageMin });
    });

    // 鮮度重み: 30分以内=1.5 / 60分以内=1.2 / それ以上=1.0
    const weight = a => a <= 30 ? 1.5 : a <= 60 ? 1.2 : 1.0;
    const countOf = (s, sub) => s.split(sub).length - 1;
    const dKws = ['遅延','止ま','見合','遅れ','ダイヤ乱れ','運転見合'];
    const cKws = ['混雑','混み','人多','入場規制','満員'];
    let dScore = 0, cScore = 0;
    for (const it of items) {
      const w = weight(it.ageMin);
      dScore += dKws.reduce((s,k)=>s + countOf(it.text, k), 0) * w;
      cScore += cKws.reduce((s,k)=>s + countOf(it.text, k), 0) * w;
    }
    dScore = Math.round(dScore);
    cScore = Math.round(cScore);

    // 遅延分数（ツイート本文から）: 「遅・かかっ…」近傍の N分 / N時間
    const CTX = '(?:遅|かかっ|かけて|かかり|待|延|停滞)';
    const re  = new RegExp(`${CTX}[^。]{0,20}?(\\d{1,3})\\s*分(?!前)|(\\d{1,3})\\s*分(?!前)[^。]{0,20}?${CTX}`, 'g');
    const reH = new RegExp(`(\\d{1,2})\\s*時間[^。]{0,10}?${CTX}`, 'g');
    let delayMin = 0;
    for (const it of items) {
      const cleaned = it.text.replace(/\d{1,2}時\d{1,2}分/g, '');
      for (const m of cleaned.matchAll(re)) {
        const n = parseInt(m[1] || m[2], 10);
        if (n > 0 && n < 300) delayMin = Math.max(delayMin, n);
      }
      for (const m of cleaned.matchAll(reH)) {
        delayMin = Math.max(delayMin, parseInt(m[1], 10) * 60);
      }
    }

    const hasStrong = items.some(it => /ダイヤ乱れ|大幅遅延|全線ストップ|長時間/.test(it.text));

    return {
      delayScore: dScore,
      crowdScore: cScore,
      headlines: items.slice(0, 3).map(x => x.text),
      delayMin,
      hasStrong,
    };
  } catch(e) {
    console.warn('detail', lineName, e);
    return empty;
  }
}

// ============================================================
// ランク算出
// ============================================================
function calculateRank(delayScore, crowdScore, statusText, tweetDelayMin = 0, tweetHasStrong = false) {
  if (statusText.includes('情報取得失敗'))
    return { rank:'-', color:'#5f6368', desc:'失敗' };

  const isNormal = statusText.includes('平常運転');
  const delayMin = Math.max(extractDelayMin(statusText), tweetDelayMin);

  // 時間帯バイアス: ラッシュ時は騒がしいので閾値+3、深夜は静かなので -2
  const h       = new Date().getHours();
  const isRush  = (h >= 7 && h <= 10) || (h >= 17 && h <= 20);
  const isQuiet = h >= 23 || h < 6;
  const off     = isRush ? 3 : isQuiet ? -2 : 0;

  if (!isNormal) {
    if (['見合わせ','運休','中断','脱線','不通','運転停止','全線ストップ'].some(w=>statusText.includes(w)))
      return { rank:'E', color:'#B21111', desc:'不通' };
    const strongD = ['大幅','大規模','ダイヤ乱れ','長時間','遅延拡大','混乱'].some(w=>statusText.includes(w));
    if (strongD || delayMin >= 45)
      return { rank:'D', color:'#FF6D01', desc:'大遅' };
    return { rank:'C', color:'#EA4335', desc:'遅延' };
  }

  // 平常時: ツイート由来の強シグナル＋分数
  if (tweetDelayMin >= 45) return { rank:'D', color:'#FF6D01', desc:'大遅' };
  if (tweetHasStrong && tweetDelayMin >= 10) return { rank:'C', color:'#EA4335', desc:'遅延' };
  if (tweetDelayMin >= 20) return { rank:'C', color:'#EA4335', desc:'遅延' };
  if (delayScore >= 8 + off || tweetDelayMin >= 10) return { rank:'B', color:'#FBBC04', desc:'予兆' };
  if (delayScore >= 3 + off || crowdScore >= 3 + off) {
    const desc = crowdScore > delayScore ? '混雑' : '微遅';
    return { rank:'A-', color:'#A8D18D', desc };
  }
  return { rank:'A', color:'#34A853', desc:'平常' };
}

// statusText から遅延分数を抽出。「○時間」「○分」の最大値を分単位で返す
function extractDelayMin(s) {
  if (!s) return 0;
  let max = 0;
  for (const m of s.matchAll(/(\d+)\s*時間/g)) max = Math.max(max, parseInt(m[1],10) * 60);
  for (const m of s.matchAll(/(\d+)\s*分/g))   max = Math.max(max, parseInt(m[1],10));
  return max;
}

function scoreDelayColor(s) {
  if (s>=50) return '#EA4335'; if (s>=20) return '#FF6D01';
  if (s>=10) return '#FBBC04'; if (s>=5)  return '#FFF176';
  return '#555';
}
function scoreCrowdColor(s) {
  if (s>=15) return '#FF6D01'; if (s>=8) return '#FBBC04';
  if (s>=3)  return '#FFF176';
  return '#555';
}

let isLoading = false;

// 追跡パネルの遅延マーク用。refresh() が更新する
let lineRankMap = {};

function officialStatusForLine(lineName, official) {
  if (official[lineName]) return official[lineName];
  const kws = TARGET_LINE_KEYMAP[lineName];
  if (kws) {

async function refreshInner() {
  const official = await fetchOfficialStatus();

  // 広域情報
  const skipKws     = ['横浜線','相鉄'];
  const priorityKws = ['東急田園都市','小田急'];
  const allEntries  = Object.entries(official)
    .filter(([n]) => !skipKws.some(k => n.includes(k)));
  const priorityLines = allEntries
    .filter(([n])    =>  priorityKws.some(k => n.includes(k)))
    .sort(([a],[b])  => a.localeCompare(b));
  const middleLines   = allEntries
    .filter(([n,s])  => !priorityKws.some(k => n.includes(k)) && s !== 'その他')
    .sort(([a],[b])  => a.localeCompare(b));
  const sonoOther     = allEntries
    .filter(([n,s])  => !priorityKws.some(k => n.includes(k)) && s === 'その他')
    .sort(([a],[b])  => a.localeCompare(b));
  const sortedEntries = [...priorityLines, ...middleLines, ...sonoOther];
  const count         = sortedEntries.length;
  let wideRows        = sortedEntries.map(([n,s]) => `【${n}】${s}`);
  if (!wideRows.length) wideRows = ['現在、関東他路線に目立った遅延はありません'];

  // 非広域路線を先に処理してランクを収集。詳細ページは並列取得（順序は TARGET_LINES 通り）
  const detailLines = TARGET_LINES.filter(line => line !== '広域');
  const details     = await Promise.all(detailLines.map(line => fetchLineDetail(line)));
  const lineItems   = detailLines.map((line, i) => {
    const rt     = details[i];
    const stFull = officialStatusForLine(line, official);
    const ri     = calculateRank(rt.delayScore, rt.crowdScore, stFull, rt.delayMin, rt.hasStrong);
    return { line, rank:ri.rank, rankColor:ri.color, desc:ri.desc,
             delayScore:rt.delayScore, crowdScore:rt.crowdScore,
             delayMin:rt.delayMin,
             headlines:rt.headlines.slice(0,2), isWide:false };
  });

  lineRankMap = Object.fromEntries(lineItems.map(it => [it.line, { rank: it.rank, color: it.rankColor }]));
  // カード・ランクサマリーに出す路線。TRACKER_ONLY_LINES は追跡パネル専用なので外す
  const shownItems = lineItems.filter(it => !TRACKER_ONLY_LINES.includes(it.line));
  // 東急田園都市線以降のランクサマリー
  const rankSummary = shownItems.map(it => ({ rank: it.rank, color: it.rankColor }));
  // 小田急 or 田園都市 が遅延しているかどうか（件数末尾表示の条件）
  const userPriorityKws  = ['東急田園都市', '小田急'];
  const hasUserDelayed   = lineItems.some(it =>
    it.rank !== 'A' && userPriorityKws.some(k => it.line.includes(k))
  );

  // 広域アイテム
  let wRank, wColor;
  if      (count === 0)  { wRank='-';  wColor='#34A853'; }
  else if (count <= 3)   { wRank='!';  wColor='#FBBC04'; }
  else if (count <= 8)   { wRank='!';  wColor='#FF6D01'; }
  else if (count <= 15)  { wRank='!!'; wColor='#EA4335'; }
  else                   { wRank='!!'; wColor='#9C27B0'; }
  const wDesc = count > 0 ? `関東 遅延${count}路線` : '関東他路線 平常';

  const items = [
    { line:'広域', rank:wRank, rankColor:wColor, desc:wDesc,
      delayScore:0, crowdScore:0, headlines:wideRows, isWide:true,
      rankSummary, wideCount: count, hasUserDelayed },
    ...shownItems
  ];

  renderCards(items);
  setFetchStatus(items.length === 0 ? 'NG' : 'OK', '#26C6DA');
}

function renderCards(items) {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  for (const st of items) {
    const card = document.createElement('div');
    card.className = 'card';

    let html;
    if (st.isWide) {
      const countLabel = st.wideCount > 0 ? `遅延 ${st.wideCount}路線` : '平常';
      html =
        `<div class="card-header">` +
        `<span class="line-name">${escHtml(st.line)}</span>` +
        `<span style="display:flex;align-items:center;gap:10px">` +
          `<span style="color:${st.rankColor};font-weight:600">${escHtml(countLabel)}</span>` +
          `<span class="rank-badge" style="color:${st.rankColor}">${escHtml(st.rank)}</span>` +
        `</span>` +
        `</div>`;
    } else {
      html =
        `<div class="card-header">` +
        `<span class="line-name">${escHtml(st.line)}</span>` +
        `<span class="rank-badge" style="color:${st.rankColor}">${escHtml(st.rank)}</span>` +
        `</div>` +
        `<div class="card-desc">${escHtml(st.desc)}</div>`;
    }

    if (!st.isWide) {
      const minColor = st.delayMin>=45 ? '#FF6D01' : st.delayMin>=20 ? '#EA4335' : st.delayMin>=10 ? '#FBBC04' : '#555';
      html +=
        `<div class="scores">` +
        `<span style="color:#555">遅:</span>` +
        `<span style="color:${scoreDelayColor(st.delayScore)};font-weight:${st.delayScore>=20?600:400}">` +
          `${st.delayScore}</span>` +
        `<span style="color:#555">　混:</span>` +
        `<span style="color:${scoreCrowdColor(st.crowdScore)};font-weight:${st.crowdScore>=15?600:400}">` +
          `${st.crowdScore}</span>` +
        `<span style="color:#555">　分:</span>` +
        `<span style="color:${minColor};font-weight:${st.delayMin>=20?600:400}">` +
          `${st.delayMin||0}</span>` +
        `</div>`;
    }

    // 広域カードのランクサマリーは外部の #rank-summary-row へ移動
    if (st.isWide) {
      const rankRow = document.getElementById('rank-summary-row');
      const sep = '<span style="color:#555"> / </span>';
      const parts = [];
      if (st.rankSummary && st.rankSummary.length > 0) {
        parts.push(st.rankSummary
          .map(r => `<span style="color:${r.color}">${escHtml(r.rank)}</span>`)
          .join(sep));
      }
      // 関東広域に遅延がある時は件数を末尾に追加
      // - 小田急 or 田園都市 が遅延 → 「件数 + !!」
      // - それ以外（横浜線・相鉄・他社のみ遅延） → 件数だけ
      if (st.wideCount > 0) {
        const tail = st.hasUserDelayed
          ? `${st.wideCount} ${escHtml(st.rank)}`
          : `${st.wideCount}`;
        parts.push(`<span style="color:${st.rankColor}">${tail}</span>`);
      }
      rankRow.innerHTML = parts.join(sep);
    }

    if (st.headlines.length > 0) {
      const hl = st.isWide
        ? `<div style="color:${st.rankColor};white-space:pre-wrap">${escHtml(st.headlines.join('\n'))}</div>`
        : escHtml(st.headlines.join('\n'));
      const hlClass = st.isWide ? 'headlines headlines-wide' : 'headlines';
      html += `<div class="divider-thin"></div><div class="${hlClass}">${hl}</div>`;
    }

    card.innerHTML = html;
    container.appendChild(card);
  }
}

// ============================================================
const COUNTDOWN_MAX = 2;
let countdownTargets = []; // { label: 'HH:MM', desc, time: Date }

// 表示モード: 天気 → カウントダウン → 両方 のサイクル
const DISPLAY_MODES  = ['weather', 'countdown', 'both'];
const MODE_LABEL_JP  = { weather: '天気', countdown: 'CD', both: 'ALL' };
let displayMode      = 'weather';

// 自動カウントダウンの定型スケジュール (HH:MM 順)
const COUNTDOWN_SCHEDULE = [
  { time: '8:04',  desc: '秦野[小]' },
  { time: '8:13',  desc: '秦野[小]' },
  { time: '8:46',  desc: '相模大野[小]' },
  { time: '8:52',  desc: '相模大野[小]' },
  { time: '8:55',  desc: '中央林間[田]' },
  { time: '9:01',  desc: '中央林間[田]' },
  { time: '9:15',  desc: '出社' },
  { time: '12:00', desc: '昼食' },
  { time: '13:00', desc: '午後' },
  { time: '18:15', desc: '終業' },
  { time: '18:23', desc: '南町田[田]' },
  { time: '18:26', desc: '南町田[田]' },
  { time: '18:35', desc: '中央林間[小]' },
  { time: '18:45', desc: '相模大野[小]' },
  { time: '19:18', desc: '秦野[着]' },
];

function makeTargetFromHHMM(timeStr, desc, fromDate) {
  const m = timeStr.match(/^(\d{1,2}):(\d{1,2})$/);
  if (!m) return null;
  const hh = parseInt(m[1],10), mm = parseInt(m[2],10);
  if (hh>23||mm>59) return null;
  const t = new Date(fromDate);
  t.setHours(hh, mm, 0, 0);
  if (t <= fromDate) t.setDate(t.getDate() + 1); // 過ぎていたら翌日
  const pad = n => String(n).padStart(2,'0');
  return { label: `${pad(hh)}:${pad(mm)}`, desc, time: t };
}

function refillFromSchedule() {
  const now = new Date();
  const keyOf = t => `${t.label}|${t.desc}`;
  const existing = new Set(countdownTargets.map(keyOf));
  const candidates = COUNTDOWN_SCHEDULE
    .map(s => makeTargetFromHHMM(s.time, s.desc, now))
    .filter(c => c && !existing.has(keyOf(c)))
    .sort((a, b) => a.time - b.time);
  while (countdownTargets.length < COUNTDOWN_MAX && candidates.length > 0) {
    countdownTargets.push(candidates.shift());
  }
}

function applyDisplayMode(mode) {
  displayMode = mode;
  try { localStorage.setItem(LS_COUNTDOWN_MODE, mode); } catch(e) {}
  const showWeather   = (mode === 'weather' || mode === 'both');
  const showCountdown = (mode === 'countdown' || mode === 'both');
  document.getElementById('weather-panel').style.display    = showWeather   ? '' : 'none';
  document.getElementById('countdown-panel').style.display  = showCountdown ? '' : 'none';
  document.getElementById('custom-cd-wrap').style.display   = showCountdown ? '' : 'none';
  if (showCountdown) {
    refillFromSchedule();
    updateCountdown();
  } else {
    countdownTargets = [];
  }
  applyTrackerVisibility();
  refreshCountdownButton();
}

function cycleDisplayMode() {
  const idx = DISPLAY_MODES.indexOf(displayMode);
  applyDisplayMode(DISPLAY_MODES[(idx + 1) % DISPLAY_MODES.length]);
}

const LS_COUNTDOWN_MODE = 'trainwatch_display_mode';

function refreshCountdownButton() {
  const btn = document.getElementById('countdown-btn');
  const custom = countdownTargets.find(t => t.isCustom);
  btn.textContent = custom ? `任意: ${custom.label}` : '任意時刻';
  const tBtn = document.getElementById('cd-toggle-btn');
  if (tBtn) tBtn.textContent = `モードセレクト(${MODE_LABEL_JP[displayMode]})`;
}

function parseTargetTime(input) {
  const trimmed = input.trim();
  let hh, mm, ss = 0, desc = '';
  // パターン1: HH:MM[:SS] [説明]
  let m = trimmed.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?(?:\s+(.+))?$/);
  if (m) {
    hh = parseInt(m[1],10); mm = parseInt(m[2],10); ss = parseInt(m[3]||'0',10);
    desc = (m[4] || '').trim();
  } else {
    // パターン2: HHMM / HMM (3〜4桁) [説明]   例: 1024 打合せ / 824 朝食
    m = trimmed.match(/^(\d{3,4})(?:\s+(.+))?$/);
    if (!m) return null;
    const digits = m[1];
    if (digits.length === 3) { hh = parseInt(digits[0],10);     mm = parseInt(digits.slice(1),10); }
    else                     { hh = parseInt(digits.slice(0,2),10); mm = parseInt(digits.slice(2),10); }
    desc = (m[2] || '').trim();
  }
  if (hh>23||mm>59||ss>59) return null;
  const now    = new Date();
  const target = new Date(now);
  target.setHours(hh, mm, ss, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const pad = n => String(n).padStart(2,'0');
  return {
    label: `${pad(hh)}:${pad(mm)}${ss ? ':'+pad(ss) : ''}`,
    desc,
    time: target,
  };
}

function toggleCustomCountdown() {
  const existing = countdownTargets.find(t => t.isCustom);
  const help = existing
    ? `任意時刻 (現: ${existing.label} ${existing.desc})。新時刻で上書き、空欄で解除。`
    : '任意時刻 (例: 14:30 打合せ)。HTMLを開いている間だけ保持。';
  const input = prompt(help, '');
  if (input === null) return;
  // 既存の任意時刻はいったん除去
  countdownTargets = countdownTargets.filter(t => !t.isCustom);
  if (input.trim() !== '') {
    const t = parseTargetTime(input);
    if (!t) { alert('形式が違います: HH:MM 説明'); return; }
    t.isCustom = true;
    countdownTargets.push(t);
    // 天気モードなら「両方」モードに自動移行（カウントダウンが見えるように）
    if (displayMode === 'weather') {
      applyDisplayMode('both');
    }
    // 上限超過時は自動枠の最遠を退避
    if (countdownTargets.length > COUNTDOWN_MAX) {
      let farIdx = -1, farTime = -Infinity;
      countdownTargets.forEach((x, i) => {
        if (!x.isCustom && x.time > farTime) { farTime = x.time; farIdx = i; }
      });
      if (farIdx >= 0) countdownTargets.splice(farIdx, 1);
    }
  }
  refreshCountdownButton();
  updateCountdown();
}

const COUNTDOWN_GRACE_MS = 60 * 1000; // 期限後の表示維持時間

// 残り秒数に応じた色。カウントダウンと追跡パネルで共用する
const colorOf = s => {
  if (s <=     0) return '#EC407A'; // 期限超過 (0:00 維持中): ピンク
  if (s <=    60) return '#EA4335'; // 1分以下: 赤
  if (s <=   120) return '#FF6D01'; // 2分以下: オレンジ
  if (s <=   300) return '#F9A825'; // 5分以下: 濃いめの黄
  if (s <=   600) return '#4FC3F7'; // 10分以下: 水色
  if (s <=  1800) return '#1E88E5'; // 30分以下: 濃い青
  if (s <=  3600) return '#AB47BC'; // 60分以下: 紫
  if (s <=  7200) return '#66BB6A'; // 60〜120分: 明るめ緑
  if (s <= 10800) return '#388E3C'; // 120〜180分: 濃いめ緑
  if (s <= 43200) return '#546E7A'; // 180分〜12時間: 灰青
  return '#9E9E9E';                 // 12時間超: 灰
};

function updateCountdown() {
  if (displayMode === 'weather') return; // カウントダウン非表示モードでは何もしない
  const now = new Date();
  // 期限超過から1分以上経過したものは削除
  countdownTargets = countdownTargets.filter(t => now - t.time < COUNTDOWN_GRACE_MS);
  // 自動スケジュールから補充
  refillFromSchedule();
  if (countdownTargets.length === 0) {
    refreshCountdownButton();
    return;
  }
  // 最も近いもの（過去含む、小さい時刻が先）
  countdownTargets.sort((a,b) => a.time - b.time);
  const fmtRemain = (date) => {
    const diff = date - now;
    if (diff <= 0) return { sec: 0, hms: '0:00' };
    const s   = Math.ceil(diff / 1000);
    const pad = n => String(n).padStart(2,'0');
    const hh  = Math.floor(s / 3600);
    const mm  = Math.floor((s % 3600) / 60);
    const ss  = s % 60;
    return { sec: s, hms: hh > 0 ? `${hh}:${pad(mm)}:${pad(ss)}` : `${mm}:${pad(ss)}` };
  };
  const nearest = countdownTargets[0];
  const r = fmtRemain(nearest.time);
  const main = document.getElementById('countdown-main');
  const descPart = nearest.desc ? ` ${nearest.desc}` : '';
  main.innerHTML =
    `<span style="font-size:0.8em">${escHtml(nearest.label + descPart)}</span>  ` +
    `<span style="color:${colorOf(r.sec)};font-size:1.65em;font-weight:900">${escHtml(r.hms)}</span>`;
  main.style.color = ''; // 既定色（ラベル/説明は中立）
  // サブ: 2件目があれば表示
  const sub = document.getElementById('countdown-sub');
  if (countdownTargets.length > 1) {
    const next  = countdownTargets[1];
    const nr    = fmtRemain(next.time);
    const nDesc = next.desc ? ` ${next.desc}` : '';
    sub.innerHTML =
      `<span style="font-size:0.8em">${escHtml(next.label + nDesc)}</span>  ` +
      `<span style="color:${colorOf(nr.sec)};font-size:1.5em;font-weight:800">${escHtml(nr.hms)}</span>`;
    sub.style.color = '';
  } else {
    sub.textContent = '';
  }
}

// ============================================================
// 追跡パネル
// ============================================================
const LS_TRACKER_ON = 'trainwatch_tracker_on';

// 経路順に並べたボード。ID は TIMETABLE のキーと一致
// r1 = 秦野〜相模大野〜中央林間〜南町田 / r2 = 秦野〜海老名〜横浜〜馬車道
const TRACKER_BOARDS = {
  r1: {
    go:   [{ id:'G1', station:'秦野' },   { id:'G2', station:'相模大野' },
           { id:'G3', station:'中央林間' }, { id:'G4', station:'南町田' }],
    back: [{ id:'K1', station:'南町田' }, { id:'K2', station:'中央林間' },
           { id:'K3', station:'相模大野' }, { id:'K4', station:'秦野' }],
  },
  r2: {
    go:   [{ id:'R2G1', station:'秦野' },   { id:'R2G2', station:'海老名' },
           { id:'R2G3', station:'横浜' }],
    back: [{ id:'R2K1', station:'馬車道' }, { id:'R2K2', station:'横浜' },
           { id:'R2K3', station:'海老名' }],
  },
};
const TRACKER_DEFAULT_BOARD = {
  r1: { go: 'G1',   back: 'K1' },
  r2: { go: 'R2G1', back: 'R2K1' },
};

// 種別の色分け。快速系=オレンジ / 各停=青 / 急行=赤 / 特急=紫 / 準急=緑
const TRACKER_TYPE_CLASS = {
  '快急': 'tr-ty-rapid', '通快': 'tr-ty-rapid', '快速': 'tr-ty-rapid',
  '各停': 'tr-ty-local',
  '急行': 'tr-ty-exp',   '通急': 'tr-ty-exp',
  '特急': 'tr-ty-ltd',   '準特': 'tr-ty-ltd',  '通特': 'tr-ty-ltd',
  '準急': 'tr-ty-semi',  '区急': 'tr-ty-semi',
};

// 到着駅ラベル（arrLabel）は漢字1文字に詰める。大野→大 / 林間→林 / 終着→終 / 秦野→秦
function arrAbbr(label) {
  return Array.from(label || '')[0] || '';
}

// 0=OFF / 1=ルート1 / 2=ルート2
let trackerOn      = 0;
let trackerDir     = 'go';
let trackerBoardId = 'G1';

function trackerRoute() { return trackerOn === 2 ? 'r2' : 'r1'; }

// 2:00〜11:59 は行き、それ以外は帰り
function defaultTrackerDir(now) {
  const h = now.getHours();
  return (h >= 2 && h < 12) ? 'go' : 'back';
}

function applyTrackerVisibility() {
  const wrap = document.getElementById('tracker-wrap');
  wrap.style.display = (displayMode === 'both') ? 'block' : 'none';
}

// OFF → ルート1 → ルート2 → OFF
function toggleTracker() {
  trackerOn = (trackerOn + 1) % 3;
  try { localStorage.setItem(LS_TRACKER_ON, String(trackerOn)); } catch(e) {}
  if (trackerOn) trackerBoardId = TRACKER_DEFAULT_BOARD[trackerRoute()][trackerDir];
  renderTrackerControls();
  renderTrackerList();
}

function setTrackerDir(dir) {
  trackerDir     = dir;
  trackerBoardId = TRACKER_DEFAULT_BOARD[trackerRoute()][dir];
  renderTrackerControls();
  renderTrackerList();
}

function setTrackerBoard(id) {
  trackerBoardId = id;
  renderTrackerControls();
  renderTrackerList();
}

function renderTrackerControls() {
  const btn = document.getElementById('tracker-toggle');
  btn.textContent = trackerOn === 2 ? '追跡 ON (root 2)' : trackerOn === 1 ? '追跡 ON' : '追跡 OFF';
  btn.className   = trackerOn ? 'on' : '';
  document.getElementById('tracker-body').className = trackerOn ? 'on' : '';

  // 方向ボタンは追跡ボタンと同じ行にあるので、OFF 時は自前で消す
  const dirEl = document.getElementById('tracker-dir');
  if (!trackerOn) { dirEl.innerHTML = ''; return; }

  dirEl.innerHTML =
    `<button class="tracker-dir-btn${trackerDir==='go'?' sel':''}" ` +
    `onclick="setTrackerDir('go')">△行き</button>` +
    `<button class="tracker-dir-btn${trackerDir==='back'?' sel':''}" ` +
    `onclick="setTrackerDir('back')">▼帰り</button>`;

  document.getElementById('tracker-stations').innerHTML =
    TRACKER_BOARDS[trackerRoute()][trackerDir].map(b =>
      `<button class="tracker-st-btn${b.id===trackerBoardId?' sel':''}" ` +
      `onclick="setTrackerBoard('${b.id}')">${escHtml(b.station)}</button>`
    ).join('');
}

function initTracker() {
  try {
    const v = localStorage.getItem(LS_TRACKER_ON);
    trackerOn = (v === '1' || v === '2') ? Number(v) : 0;
  } catch(e) { trackerOn = 0; }
  trackerDir     = defaultTrackerDir(new Date());
  trackerBoardId = TRACKER_DEFAULT_BOARD[trackerRoute()][trackerDir];
  renderTrackerControls();
  renderTrackerList();
}

function trackerNowMin(now) {
  const m = now.getHours() * 60 + now.getMinutes();
  return m < 120 ? m + 1440 : m;
}

// 0:00〜1:59 は前日のダイヤを使う
function trackerDiaKind(now) {
  const d = new Date(now);
  if (d.getHours() < 2) d.setDate(d.getDate() - 1);
  const pad = n => String(n).padStart(2, '0');
  const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if (typeof TT_HOLIDAYS !== 'undefined' && TT_HOLIDAYS.has(key)) return 'ho';
  const w = d.getDay();
  return (w === 0 || w === 6) ? 'ho' : 'wd';
}

// 直前に出た1本＋次の9本
function pickTrains(rows, nowMin) {
  let nextIdx = rows.findIndex(r => r[0] >= nowMin);
  if (nextIdx < 0) nextIdx = rows.length;
  const start = Math.max(0, nextIdx - 1);
  return { list: rows.slice(start, start + 10), nextIdx: nextIdx - start };
}

function fmtHHMM(min) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(Math.floor(min / 60) % 24)}:${pad(min % 60)}`;
}

function fmtRemainSec(sec) {
  const pad = n => String(n).padStart(2, '0');
  if (sec <= 0) return '0:00';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// keepScroll が真ならスクロール位置を維持する（1秒ごとの再描画用）
function renderTrackerList(keepScroll) {
  const el = document.getElementById('tracker-list');
  if (!trackerOn) { el.innerHTML = ''; return; }
  const savedScroll = keepScroll ? el.scrollTop : 0;

  const board = (typeof TIMETABLE !== 'undefined') ? TIMETABLE[trackerBoardId] : null;
  if (!board) {
    el.innerHTML = '<div id="tracker-empty">時刻表データがありません</div>';
    el.scrollTop = savedScroll;
    return;
  }
  const now  = new Date();
  const rows = board[trackerDiaKind(now)];
  if (rows === undefined) {
    el.innerHTML = '<div id="tracker-empty">この曜日のデータがありません</div>';
    el.scrollTop = savedScroll;
    return;
  }
  if (rows.length === 0) {
    el.innerHTML = '<div id="tracker-empty">時刻表が空です</div>';
    el.scrollTop = savedScroll;
    return;
  }
  const nowMin = trackerNowMin(now);
  const picked = pickTrains(rows, nowMin);

  const delay    = trackerDelayInfo(board.line);
  const nowSecOf = min => (min - nowMin) * 60 - now.getSeconds();

  // これから乗れる列車のうち、目的地への到着が早い2本（先行の各停を特急が追い越す場合があるので
  // 発車順ではなく到着時刻順で選ぶ）
  const soonestArr = new Set(
    picked.list
      .map((r, i) => ({ i, arr: r[3] }))
      .filter(o => o.i >= picked.nextIdx && o.arr >= 0)
      .sort((a, b) => a.arr - b.arr)
      .slice(0, 2)
      .map(o => o.i)
  );

  const rowsHtml = picked.list.map((r, i) => {
    const isNext = (i === picked.nextIdx);
    const isPast = (i < picked.nextIdx);
    const cls    = 'tracker-row' + (isPast ? ' past' : '') + (isNext ? ' next' : '')
                 + (soonestArr.has(i) ? ' tr-soonest' : '');
    const color  = delay ? ` style="color:${delay.color}"` : '';
    const unreachable = r[3] < 0;
    const arr    = unreachable ? '不可' : `${escHtml(arrAbbr(board.arrLabel))} ${fmtHHMM(r[3])}`;
    const destCls = 'tr-dest' + (unreachable ? ' tr-unreachable' : '');
    const arrCls  = 'tr-arr' + (unreachable ? ' tr-unreachable' : '');
    // 残り時間は次発とその次の2件まで出す
    const showLeft = (i === picked.nextIdx || i === picked.nextIdx + 1);
    const leftSec = nowSecOf(r[0]);
    const left    = showLeft ? fmtRemainSec(leftSec) : '';
    const leftSty = showLeft ? ` style="color:${colorOf(leftSec)}"` : '';
    // 幅は "12:34" 想定。それより長い "1:12:34" は字を縮めて同じ幅に収める
    const leftCls = 'tr-left' + (left.length > 5 ? ' tr-left-long' : '');
    const tyName = TT_TYPES[r[1]] || '';
    const tyCls  = 'tr-type' + (TRACKER_TYPE_CLASS[tyName] ? ' ' + TRACKER_TYPE_CLASS[tyName] : '');
    return `<div class="${cls}"${color}>` +
      `<span class="tr-mark">${isNext ? '▶' : ''}</span>` +
      `<span class="tr-dep">${fmtHHMM(r[0])}</span>` +
      `<span class="${tyCls}">${escHtml(tyName)}</span>` +
      `<span class="tr-bang">${delay ? '!' : ''}</span>` +
      `<span class="${destCls}">${escHtml(TT_DESTS[r[2]] || '')}</span>` +
      `<span class="${arrCls}">${arr}</span>` +
      `<span class="${leftCls}"${leftSty}>${left}</span>` +
      `</div>`;
  }).join('');
  // 次発が範囲外＝本日の残り列車なし。行は残したまま案内を追記する
  const ended = (picked.nextIdx >= picked.list.length)
    ? '<div id="tracker-empty">本日の運行は終了しました</div>'
    : '';
  el.innerHTML = rowsHtml + ended;
  el.scrollTop = savedScroll;
}

// 路線ランクが B 以上（B/C/D/E）なら遅延扱い。個々の列車の遅れは見ない
// A- は混雑スコアだけで付くことがあり「!」がうるさいので対象外
const TRACKER_QUIET_RANKS = new Set(['A', 'A-', '-']);

function trackerDelayInfo(lineName) {
  const info = lineRankMap[lineName];
  if (!info || TRACKER_QUIET_RANKS.has(info.rank)) return null;
  return info;
}

// ============================================================
// 起動
// ============================================================
// 1秒ごとの再描画は1本のタイマーに集約（タイマー間のズレ防止）
function tick() {
  updateClock();
  updateCountdown();
  if (trackerOn && displayMode === 'both') renderTrackerList(true);
}

updateClock();

// 前回モードの復元（無ければ天気）
let initialMode = 'weather';
try {
  const saved = localStorage.getItem(LS_COUNTDOWN_MODE);
  if (DISPLAY_MODES.includes(saved)) initialMode = saved;
} catch(e) {}
applyDisplayMode(initialMode);
initTracker();

// バッテリー
(async () => {
  const el = document.getElementById('battery');
  try {
    const bat = await navigator.getBattery();
    const update = () => {
      const pct = Math.round(bat.level * 100);
      el.textContent = (bat.charging ? '⚡' : '') + pct + '%';
      el.style.color = pct <= 20 ? '#FF5252' : pct <= 50 ? '#FFD54F' : '#26C6DA';
    };
    update();
    bat.addEventListener('levelchange',   update);
    bat.addEventListener('chargingchange', update);
  } catch(e) { /* 取れない時は -- のまま */ }
})();

setInterval(tick, 1000);

// ---- 自動更新 ----
// 非表示中（別アプリ/スリープ）は取得をスキップし、復帰時にまとめて取り直す
const AUTO_REFRESH_MS = 5 * 60 * 1000;
const RESUME_STALE_MS = 60 * 1000;   // 復帰時、これより古ければ即再取得
let lastAutoFetch = 0;

function autoFetch() {
  lastAutoFetch = Date.now();
  fetchWeather();
  refresh();
}

autoFetch();
setInterval(() => { if (!document.hidden) autoFetch(); }, AUTO_REFRESH_MS);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  tick();   // スリープ復帰直後の時計・カウントダウンのズレを即補正
  if (Date.now() - lastAutoFetch >= RESUME_STALE_MS) autoFetch();
});
</script>
</body>
